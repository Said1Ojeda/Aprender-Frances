<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Allez! · Francés desde cero</title>
<meta name="description" content="Aprende francés básico desde el español con lecciones cortas, sin cuenta y sin anuncios.">
<meta name="theme-color" content="#2F5BEA">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_GT">
<meta property="og:title" content="Allez! · Francés desde cero">
<meta property="og:description" content="Lecciones cortas de francés para quien habla español, con voz, micrófono y repaso espaciado.">
<meta property="og:url" content="https://said1ojeda.github.io/Aprender-Frances/">
<meta property="og:image" content="https://said1ojeda.github.io/Aprender-Frances/docs/vista.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="iconos/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Allez!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="barra">
  <div class="envoltura">
    <button class="marca" type="button" data-ir="inicio" aria-label="Ir al inicio">Allez<span>!</span></button>
    <div class="indicadores" id="indicadores"></div>
  </div>
</header>

<main>
  <!-- inicio con el camino de unidades -->
  <section class="pantalla activa" id="p-inicio" aria-labelledby="t-inicio">
    <div class="envoltura">
      <div class="portada">
        <p class="ceja" id="saludo">Bonjour</p>
        <h1 id="t-inicio">Francés desde cero, en ratitos.</h1>
        <p class="bajada">Lecciones de cinco minutos pensadas para quien habla español. Empieza por arriba y ve desbloqueando.</p>
      </div>
      <div class="tablero" id="tablero"></div>
      <div class="accesos">
        <button class="boton suave" type="button" data-ir="palabras">📖 Mis palabras</button>
      </div>
      <div class="repaso" id="repaso" hidden></div>
      <ol class="camino" id="camino"></ol>
    </div>
  </section>

  <!-- todas las palabras con buscador -->
  <section class="pantalla" id="p-palabras" aria-labelledby="t-palabras">
    <div class="envoltura angosta">
      <button class="volver" type="button" data-ir="inicio">← Volver</button>
      <h2 class="titulo-pantalla" id="t-palabras">Mis palabras</h2>
      <p class="bajada" id="palabras-resumen"></p>
      <input class="buscar" type="search" id="buscar" placeholder="Busca en español o en francés" aria-label="Buscar palabra" autocomplete="off">
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar palabras"></div>
      <div id="lista-palabras"></div>
    </div>
  </section>

  <!-- leccion -->
  <section class="pantalla" id="p-leccion" aria-label="Lección">
    <div class="envoltura angosta">
      <div class="leccion-arriba">
        <button class="cerrar" type="button" id="salir" aria-label="Salir de la lección">✕</button>
        <div class="avance" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="avance"><i></i></div>
      </div>
      <div class="ejercicio" id="ejercicio" aria-live="polite"></div>
    </div>
    <div class="pie" id="pie">
      <div class="envoltura angosta pie-dentro">
        <div class="veredicto" id="veredicto" aria-live="assertive"></div>
        <button class="boton grande" type="button" id="comprobar" disabled>Comprobar</button>
      </div>
    </div>
  </section>

  <!-- fin de leccion -->
  <section class="pantalla" id="p-fin" aria-labelledby="t-fin">
    <div class="envoltura angosta centro">
      <p class="sello-fin" aria-hidden="true">✓</p>
      <h2 id="t-fin">¡Lección terminada!</h2>
      <p class="bajada" id="fin-frase"></p>
      <div class="resumen" id="resumen"></div>
      <div class="tip" id="tip"></div>
      <button class="boton grande" type="button" data-ir="inicio">Seguir</button>
    </div>
  </section>
</main>

<script src="js/datos.js"></script>
<script src="js/voz.js"></script>
<script src="js/repaso.js"></script>
<script src="js/app.js"></script>
</body>
</html>
